stages:
  - prepare
  - build
  - deploy

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  STABLE_TAG: "$CI_COMMIT_REF_SLUG"

  BUILDING_BLOCK_BRANCH: "stage"

prepare_context:
  stage: prepare
  image: alpine:3.20
  tags:
    - docker

  before_script:
    - apk add --no-cache git

  script:
    - set -e
    - rm -rf .docker-context
    - mkdir -p .docker-context/catalog-service
    - mkdir -p .docker-context/building-block

    # Copy current project
    - |
      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

    # Clone BuildingBlock beside current project
    - |
      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

    - ls -la .docker-context
    - ls -la .docker-context/building-block/src

  artifacts:
    paths:
      - .docker-context
    expire_in: 1 hour


build_and_push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - prepare_context

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - set -e

    - docker build
      -f .docker-context/catalog-service/Dockerfile
      -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE:$STABLE_TAG"
      .docker-context

    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$STABLE_TAG"

    - echo "IMAGE=$CI_REGISTRY_IMAGE:$STABLE_TAG" > image.env

  artifacts:
    reports:
      dotenv: image.env


deploy_coolify:
  stage: deploy
  image: curlimages/curl:8.10.1
  tags:
    - docker

  needs:
    - build_and_push

  script:
    - set -e
    - echo "Deploying image $IMAGE to Coolify..."
    - curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL"

  only:
    - main
    - stage