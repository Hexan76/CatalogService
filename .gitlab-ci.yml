stages:
  - prepare
  - build
  - deploy

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"

  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

  BUILDING_BLOCK_BRANCH: "stage"

prepare_context:
  stage: prepare
  image: alpine:3.20

  tags:
    - docker

  before_script:
    - apk add --no-cache git

  script:
    - set -e
    - echo "Preparing Docker build context..."

    - rm -rf .docker-context
    - mkdir -p .docker-context/catalog-service
    - mkdir -p .docker-context/building-block

    - echo "Copying CatalogService..."
    - |
      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

    - echo "Cloning BuildingBlock..."
    - |
      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://oauth2:${BUILDINGBLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

    - echo "Build context is ready"
    - ls -la .docker-context
    - ls -la .docker-context/catalog-service
    - ls -la .docker-context/building-block

  artifacts:
    paths:
      - .docker-context/
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


build_and_push_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  tags:
    - docker

  needs:
    - prepare_context

  script:
    - set -e
    - echo "Building and pushing image with Kaniko..."

    - mkdir -p /kaniko/.docker

    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF

    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/.docker-context" \
        --dockerfile "$CI_PROJECT_DIR/.docker-context/catalog-service/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --destination "$CI_REGISTRY_IMAGE:$BRANCH_TAG" \
        --destination "$CI_REGISTRY_IMAGE:cache" \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache" \
        --snapshot-mode=redo \
        --use-new-run

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


deploy_to_coolify:
  stage: deploy
  image: alpine:3.20

  tags:
    - docker

  needs:
    - build_and_push_image

  before_script:
    - apk add --no-cache curl

  script:
    - set -e
    - echo "Deploying to Coolify..."

    - |
      curl --fail --request GET "$COOLIFY_WEBHOOK" \
        --header "Authorization: Bearer $COOLIFY_TOKEN"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'