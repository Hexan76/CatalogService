stages:
  - prepare
  - build
  - push
  - deploy

default:
  tags:
    - shell

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"
  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  BUILDING_BLOCK_BRANCH: "stage"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnm-store/

before_script:
  - echo "Running on shell runner"
  - dotnet --version
  - docker --version

prepare_context:
  stage: prepare
  only:
    - dev
    - test
    - main
  script:
    - |
      set -e

      rm -rf .docker-context
      mkdir -p .docker-context/catalog-service
      mkdir -p .docker-context/building-block

      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      ls -la .docker-context

  artifacts:
    paths:
      - .docker-context
    expire_in: 1 hour

build_image:
  stage: build
  needs:
    - prepare_context
  only:
    - dev
    - test
    - main
  script:
    - |
      set -e

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      docker build \
        --provenance=false \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from="$CI_REGISTRY_IMAGE:cache" \
        --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --tag "$CI_REGISTRY_IMAGE:$BRANCH_TAG" \
        --tag "$CI_REGISTRY_IMAGE:cache" \
        -f .docker-context/catalog-service/Dockerfile \
        .docker-context

push_image:
  stage: push
  needs:
    - build_image
  only:
    - dev
    - test
    - main
  script:
    - |
      set -e

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      docker push "$CI_REGISTRY_IMAGE:$BRANCH_TAG"
      docker push "$CI_REGISTRY_IMAGE:cache"

deploy_coolify:
  stage: deploy
  needs:
    - push_image
  only:
    - dev
    - test
    - main
  script:
    - |
      set -e

      echo "🚀 Deploying to Coolify..."

      URL_VAR="COOLIFY_BASE_URL_${CI_COMMIT_BRANCH}"
      TOKEN_VAR="COOLIFY_TOKEN_${CI_COMMIT_BRANCH}"
      APPLICATION_ID_VAR="COOLIFY_APPLICATION_ID_${CI_COMMIT_BRANCH}"

      : "${!URL_VAR:?Missing ${URL_VAR}}"
      : "${!TOKEN_VAR:?Missing ${TOKEN_VAR}}"
      : "${!APPLICATION_ID_VAR:?Missing ${APPLICATION_ID_VAR}}"

      curl -f -sS --request PATCH \
        "${!URL_VAR}/applications/${!APPLICATION_ID_VAR}" \
        -H "Authorization: ${!TOKEN_VAR}" \
        -H "Content-Type: application/json" \
        -d "{\"docker_registry_image_tag\":\"${BRANCH_TAG}\"}" > /dev/null

      curl -f -sS -X POST \
        "${!URL_VAR}/deploy?uuid=${!APPLICATION_ID_VAR}&force=false" \
        -H "Authorization: ${!TOKEN_VAR}" \
        -H "Content-Type: application/json" > /dev/null

      echo "✅ Deployment triggered successfully"