stages:
  - prepare
  - build
  - push
  - deploy

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"
  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  BUILDING_BLOCK_BRANCH: "stage"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"


default:
  tags:
    - docker
    
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store/

before_script:
  - echo "Running on shell executor"
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

prepare_context:
  stage: prepare
  image: alpine:3.20
  only:
    - dev
    - test
    - main
  before_script:
    - apk add --no-cache git tar
    - echo "Preparing build context"
  script:
    - |
      set -e

      rm -rf .docker-context
      mkdir -p .docker-context/catalog-service
      mkdir -p .docker-context/building-block

      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      ls -la .docker-context
      ls -la .docker-context/catalog-service
      ls -la .docker-context/building-block

  artifacts:
    paths:
      - .docker-context
    expire_in: 1 hour

build_and_push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - docker
  needs:
    - prepare_context
  only:
    - dev
    - test
    - main
  script:
    - |
      set -e

      mkdir -p /kaniko/.docker

      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json

      /kaniko/executor \
        --context "$CI_PROJECT_DIR/.docker-context" \
        --dockerfile "$CI_PROJECT_DIR/.docker-context/catalog-service/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --destination "$CI_REGISTRY_IMAGE:$BRANCH_TAG" \
        --destination "$CI_REGISTRY_IMAGE:cache"
              
deploy_coolify:
  stage: deploy
  only:
    - dev
    - test
    - main
  needs:
    - push_image
  script:
    - |
      set -e

      echo "🚀 Deploying to Coolify..."

      URL_VAR="COOLIFY_BASE_URL_${CI_COMMIT_BRANCH}"
      TOKEN_VAR="COOLIFY_TOKEN_${CI_COMMIT_BRANCH}"
      APPLICATION_ID_VAR="COOLIFY_APPLICATION_ID_${CI_COMMIT_BRANCH}"

      : "${!URL_VAR:?Missing ${URL_VAR}}"
      : "${!TOKEN_VAR:?Missing ${TOKEN_VAR}}"
      : "${!APPLICATION_ID_VAR:?Missing ${APPLICATION_ID_VAR}}"

      echo "Updating image tag to: ${BRANCH_TAG}"

      curl -f -sS --request PATCH \
        "${!URL_VAR}/applications/${!APPLICATION_ID_VAR}" \
        -H "Authorization: ${!TOKEN_VAR}" \
        -H "Content-Type: application/json" \
        -d "{\"docker_registry_image_tag\":\"${BRANCH_TAG}\"}" > /dev/null

      echo "Triggering deployment..."

      curl -f -sS -X POST \
        "${!URL_VAR}/deploy?uuid=${!APPLICATION_ID_VAR}&force=false" \
        -H "Authorization: ${!TOKEN_VAR}" \
        -H "Content-Type: application/json" > /dev/null

      echo "✅ Deployment triggered successfully"