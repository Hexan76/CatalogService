stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

  BUILDING_BLOCK_BRANCH: "stage"

  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_STAGE: "$CI_REGISTRY_IMAGE:stage"

build_catalog_service_image:
  stage: build
  image: docker:27

  services:
    - name: docker:27-dind
      command: ["--tls=false"]

  tags:
    - docker

  before_script:
    - apk add --no-cache git rsync
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - rm -rf "$CI_PROJECT_DIR/../building-block"

    - |
      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://oauth2:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/../building-block"

    - rm -rf "$CI_PROJECT_DIR/.docker-context"
    - mkdir -p "$CI_PROJECT_DIR/.docker-context/catalog-service"
    - mkdir -p "$CI_PROJECT_DIR/.docker-context/building-block"

    - |
      rsync -a --delete \
        --exclude ".git" \
        --exclude ".docker-context" \
        "$CI_PROJECT_DIR/" \
        "$CI_PROJECT_DIR/.docker-context/catalog-service/"

    - |
      rsync -a --delete \
        --exclude ".git" \
        "$CI_PROJECT_DIR/../building-block/" \
        "$CI_PROJECT_DIR/.docker-context/building-block/"

    - |
      docker build \
        -f "$CI_PROJECT_DIR/.docker-context/catalog-service/Dockerfile" \
        -t "$IMAGE_SHA" \
        -t "$IMAGE_STAGE" \
        "$CI_PROJECT_DIR/.docker-context"

    - docker push "$IMAGE_SHA"
    - docker push "$IMAGE_STAGE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


deploy_to_coolify:
  stage: deploy
  image: alpine:3.20

  needs:
    - build_catalog_service_image

  before_script:
    - apk add --no-cache curl

  script:
    - |
      curl --fail --request GET "$COOLIFY_WEBHOOK" \
        --header "Authorization: Bearer $COOLIFY_TOKEN"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'