stages:
  - build

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: test
  DOCKER_TLS_CERTDIR: ""

build_only:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind

  tags:
    - docker

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - echo "Checking BuildingBlock token..."
    - '[ -n "$BUILDINGBLOCK_TOKEN" ] || (echo "ERROR: BUILDINGBLOCK_TOKEN is empty or not available" && exit 1)'
    - echo "Token length is ${#BUILDINGBLOCK_TOKEN}"

    - echo "Testing access to BuildingBlock..."
    - git ls-remote "https://oauth2:${BUILDINGBLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" HEAD

    - echo "Cloning BuildingBlock..."
    - git clone "https://oauth2:${BUILDINGBLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" BuildingBlock