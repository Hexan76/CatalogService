stages:
  - build
  - push
  - update_tag
  - deploy

default:
  tags:
    - deploy

variables:
  BB_BRANCH: "dev"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^dev-[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        ENVIRONMENT: stage
        BB_BRANCH: dev
        DEPLOY_COOLIFY_WEBHOOK: $COOLIFY_WEBHOOK
        DEPLOY_COOLIFY_TOKEN: $COOLIFY_TOKEN
        DEPLOY_COOLIFY_APPLICATION_ID: $COOLIFY_APPLICATION_ID
        DEPLOY_COOLIFY_URL: $COOLIFY_URL_STAGE
        DEPLOY_COOLIFY_METHOD: POST
        TARGET_PLATFORM: $TARGET_PLATFORM_STAGE

    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        ENVIRONMENT: production
        BB_BRANCH: dev
        DEPLOY_COOLIFY_WEBHOOK: $COOLIFY_WEBHOOK_PROD
        DEPLOY_COOLIFY_TOKEN: $COOLIFY_TOKEN_PROD
        DEPLOY_COOLIFY_APPLICATION_ID: $COOLIFY_APPLICATION_ID_PROD
        DEPLOY_COOLIFY_URL: $COOLIFY_URL_PROD
        DEPLOY_COOLIFY_METHOD: GET
        TARGET_PLATFORM: $TARGET_PLATFORM_PROD

.pipeline_rules: &pipeline_rules
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|prod)-[0-9]+\.[0-9]+\.[0-9]+$/'

before_script:
  - echo "Running on shell runner"
  - docker --version
  - |
    # APP_VERSION avoids collision with host VERSION on the shell runner.
    APP_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/^(dev|prod)-//')
    IMAGE_TAG="$APP_VERSION"
    if [ -z "$EXPOSE_PORT" ]; then
      echo "EXPOSE_PORT CI/CD variable is required"
      exit 1
    fi
    if ! echo "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
      echo "APP_VERSION must be numeric x.y.z (tag like dev-1.0.1), got: $APP_VERSION (tag: $CI_COMMIT_TAG)"
      exit 1
    fi
    export APP_VERSION IMAGE_TAG EXPOSE_PORT
    echo "Tag=$CI_COMMIT_TAG Version=$APP_VERSION IMAGE_TAG=$IMAGE_TAG Port=$EXPOSE_PORT Environment=$ENVIRONMENT"

build_image:
  stage: build
  <<: *pipeline_rules
  script:
    - |
      set -e

      echo "Preparing docker context..."
      echo "Version     : $APP_VERSION"
      echo "Expose port : $EXPOSE_PORT"
      echo "Image tag   : $IMAGE_TAG"
      echo "Environment : $ENVIRONMENT"

      rm -rf .docker-context
      mkdir -p .docker-context/catalog-service

      echo "Copying current project..."
      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

      echo "Cloning building-block beside catalog-service..."
      git clone --depth 1 \
        -b "$BB_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      echo "Login to GitLab Registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "Building docker image..."
      docker build \
        --platform "$TARGET_PLATFORM" \
        --provenance=false \
        --build-arg VERSION="$APP_VERSION" \
        --build-arg EXPOSE_PORT="$EXPOSE_PORT" \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        -t "$CI_REGISTRY_IMAGE:$ENVIRONMENT" \
        -f "$CI_PROJECT_DIR/.docker-context/catalog-service/Dockerfile" \
        "$CI_PROJECT_DIR/.docker-context"

push_image:
  stage: push
  <<: *pipeline_rules
  needs:
    - build_image
  script:
    - |
      set -e

      echo "Login to GitLab Registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "Pushing docker image..."
      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      docker push "$CI_REGISTRY_IMAGE:$ENVIRONMENT"

      echo "Image pushed successfully:"
      echo "Environment : $ENVIRONMENT"
      echo "Version     : $APP_VERSION"
      echo "Image       : $CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "Alias       : $CI_REGISTRY_IMAGE:$ENVIRONMENT"

update_coolify_tag:
  stage: update_tag
  <<: *pipeline_rules
  needs:
    - push_image
  script:
    - |
      set -e

      echo "Updating Coolify image tag..."
      echo "URL      : ${DEPLOY_COOLIFY_URL}/api/v1/applications/${DEPLOY_COOLIFY_APPLICATION_ID}"
      echo "IMAGE_TAG: $IMAGE_TAG"

      RESPONSE=$(curl -sS \
        --fail-with-body \
        --request PATCH \
        "${DEPLOY_COOLIFY_URL}/api/v1/applications/${DEPLOY_COOLIFY_APPLICATION_ID}" \
        -H "Authorization: Bearer ${DEPLOY_COOLIFY_TOKEN}" \
        -H "Content-Type: application/json" \
        --data "{
          \"docker_registry_image_tag\": \"$IMAGE_TAG\"
        }")

      echo "Coolify response:"
      echo "$RESPONSE"

      echo "Coolify image tag updated successfully."

deploy_coolify:
  stage: deploy
  <<: *pipeline_rules
  needs:
    - update_coolify_tag
  script:
    - |
      set -e

      echo "Deploying to Coolify..."
      echo "Environment : $ENVIRONMENT"
      echo "Version     : $APP_VERSION"

      COOLIFY_DEPLOY_URL="$(printf '%s' "$DEPLOY_COOLIFY_WEBHOOK" | tr -d '\r\n')"

      echo "Triggering deployment..."

      RESPONSE=$(curl -sS -X "$DEPLOY_COOLIFY_METHOD" "$COOLIFY_DEPLOY_URL" \
        -H "Authorization: Bearer $DEPLOY_COOLIFY_TOKEN")

      echo "Coolify deployment response:"
      echo "$RESPONSE"

      echo "Deployment triggered successfully."

      echo "Sending Discord notification..."

      DISCORD_URL="$(printf '%s' "$DISCORD_WEBHOOK" | tr -d '\r\n')"

      curl -sS \
        -H "Content-Type: application/json" \
        -X POST \
        --data "{\"content\":\"✅ Deployment completed\n\nEnvironment: ${ENVIRONMENT}\nProject: ${CI_PROJECT_NAME}\nTag: ${CI_COMMIT_TAG}\nVersion: $APP_VERSION\nImage: $IMAGE_TAG\nCommit: ${CI_COMMIT_SHORT_SHA}\nPipeline: ${CI_PIPELINE_URL}\n\"}" \
        "$DISCORD_URL"
