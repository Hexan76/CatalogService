stages:
  - build
  - push
  - deploy

default:
  tags:
    - deploy

variables:
  IMAGE_TAG: "stage-${CI_PIPELINE_IID}"
  BUILDING_BLOCK_BRANCH: "dev"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        ENVIRONMENT: stage
        IMAGE_TAG: stage-${CI_PIPELINE_IID}
        BUILDING_BLOCK_BRANCH: dev
        COOLIFY_WEBHOOK: $COOLIFY_WEBHOOK_STAGE
        COOLIFY_TOKEN: $COOLIFY_TOKEN_STAGE
        COOLIFY_APPLICATION_ID: $COOLIFY_APPLICATION_ID_STAGE
        COOLIFY_URL: $COOLIFY_URL_STAGE
        COOLIFY_METHOD: "-X POST"


    - if: '$CI_COMMIT_BRANCH == "prod"'
      variables:
        ENVIRONMENT: production
        IMAGE_TAG: prod-${CI_PIPELINE_IID}
        BUILDING_BLOCK_BRANCH: prod
        COOLIFY_WEBHOOK: $COOLIFY_WEBHOOK_PROD
        COOLIFY_TOKEN: $COOLIFY_TOKEN_PROD
        COOLIFY_APPLICATION_ID: $COOLIFY_APPLICATION_ID_PROD
        COOLIFY_URL: $COOLIFY_URL_PROD
        COOLIFY_METHOD: "-f -sS"

.branch_rules: &branch_rules
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^(dev|prod)$/"

before_script:
  - echo "Running on shell runner"
  - docker --version

build_image:
  stage: build
  <<: *branch_rules
  script:
    - |
      set -e

      echo "Preparing docker context..."

      rm -rf .docker-context
      mkdir -p .docker-context/catalog-service

      echo "Copying current project..."
      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

      echo "Cloning building-block beside catalog-service..."
      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      echo "Login to GitLab Registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "Building docker image..."
      docker build \
        --platform linux/arm64 \
        --provenance=false \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        -f "$CI_PROJECT_DIR/.docker-context/catalog-service/Dockerfile" \
        "$CI_PROJECT_DIR/.docker-context"

push_image:
  stage: push
  <<: *branch_rules
  needs:
    - build_image
  script:
    - |
      set -e

      echo "Login to GitLab Registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "Pushing docker image..."
      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

      echo "Image pushed successfully:"
      echo "Environment : $ENVIRONMENT"
      echo "Image       : $CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "Alias       : $CI_REGISTRY_IMAGE:$ENVIRONMENT"

deploy_coolify:
  stage: deploy
  <<: *branch_rules
  needs:
    - push_image
  script:
    - |
      set -e

      echo "Changing Image Tag..."
      echo "URL: ${COOLIFY_URL}/api/v1/applications/${COOLIFY_APPLICATION_ID}"
      echo "IMAGE_TAG: ${IMAGE_TAG}"
      echo "TOKEN LENGTH: ${#COOLIFY_TOKEN}"

      curl -v \
        --request PATCH \
        "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APPLICATION_ID}" \
        -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
        -H "Content-Type: application/json" \
        --data "{
          \"docker_registry_image_tag\": \"${IMAGE_TAG}\"
        }"

      echo "Deploying to Coolify..."
      echo "URL=[$COOLIFY_WEBHOOK]"
      echo "TOKEN=[$COOLIFY_TOKEN]"
      COOLIFY_DEPLOY_URL="$(printf '%s' "$COOLIFY_WEBHOOK" | tr -d '\r\n')"

      curl $COOLIFY_METHOD "$COOLIFY_WEBHOOK" \
        -H "Authorization: Bearer $COOLIFY_TOKEN"

      echo "Sending Discord notification..."

      DISCORD_URL="$(printf '%s' "$DISCORD_WEBHOOK" | tr -d '\r\n')"

      curl -sS \
        -H "Content-Type: application/json" \
        -X POST \
        --data "{\"content\":\"✅ Deployment completed\n\nEnvironment: ${ENVIRONMENT}\nProject: ${CI_PROJECT_NAME}\nBranch: ${CI_COMMIT_BRANCH}\nTag: ${IMAGE_TAG}\nCommit: ${CI_COMMIT_SHORT_SHA}\nPipeline: ${CI_PIPELINE_URL}\n\"}" \
        "$DISCORD_URL"
