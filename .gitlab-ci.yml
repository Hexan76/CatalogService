stages:
  - build
  - push
  - deploy

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"

  BRANCH_TAG: "$CI_COMMIT_REF_SLUG"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

  BUILDING_BLOCK_BRANCH: "stage"

  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain

before_script:
  - echo "Running on shell executor"
  - docker info
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

build_image:
  stage: build
  tags:
    - docker
  only:
    - main

  script:
    - set -e
    - echo "Preparing Docker build context..."

    - |
      CONTEXT_DIR="$CI_PROJECT_DIR/../docker-context-$CI_PIPELINE_ID"

      rm -rf "$CONTEXT_DIR"
      mkdir -p "$CONTEXT_DIR/catalog-service"
      mkdir -p "$CONTEXT_DIR/building-block"

      echo "Copying CatalogService..."
      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CONTEXT_DIR/catalog-service" -xf -

      echo "Cloning BuildingBlock..."
      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://oauth2:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CONTEXT_DIR/building-block"

      echo "Building Docker image..."

      docker build \
        --provenance=false \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from="$CI_REGISTRY_IMAGE:cache" \
        --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --tag "$CI_REGISTRY_IMAGE:$BRANCH_TAG" \
        --tag "$CI_REGISTRY_IMAGE:cache" \
        -f "$CONTEXT_DIR/catalog-service/Dockerfile" \
        "$CONTEXT_DIR"

push_image:
  stage: push
  tags:
    - docker
  only:
    - main
  needs:
    - build_image

  script: |
    set -e
    echo "Image tag: $IMAGE_TAG"
    docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    docker push "$CI_REGISTRY_IMAGE:$BRANCH_TAG"
    docker push "$CI_REGISTRY_IMAGE:cache"

deploy_to_coolify:
  stage: deploy
  tags:
    - docker
  only:
    - main
  needs:
    - push_image

  script:
    - set -e
    - echo "Deploying to Coolify..."

    - |
      curl --fail --request GET "$COOLIFY_WEBHOOK" \
        --header "Authorization: Bearer $COOLIFY_TOKEN"