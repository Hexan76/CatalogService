stages:
  - prepare
  - build
  - push

variables:
  CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"
  IMAGE_TAG: "dev"
  BUILDING_BLOCK_BRANCH: "dev"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

before_script:
  - echo "Running on shell runner"
  - dotnet --version
  - docker --version

prepare_context:
  stage: prepare
  only:
    - stage
  script:
    - |
      set -e

      rm -rf .docker-context
      mkdir -p .docker-context/catalog-service

      tar \
        --exclude=".git" \
        --exclude=".docker-context" \
        -C "$CI_PROJECT_DIR" \
        -cf - . | tar -C "$CI_PROJECT_DIR/.docker-context/catalog-service" -xf -

      git clone --depth 1 \
        -b "$BUILDING_BLOCK_BRANCH" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      ls -la .docker-context

  artifacts:
    paths:
      - .docker-context
    expire_in: 1 hour

build_image:
  stage: build
  needs:
    - prepare_context
  only:
    - stage
  script:
    - |
      set -e

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      docker build \
        --provenance=false \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from="$CI_REGISTRY_IMAGE:cache" \
        --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --tag "$CI_REGISTRY_IMAGE:cache" \
        -f .docker-context/catalog-service/Dockerfile \
        .docker-context

push_image:
  stage: push
  needs:
    - build_image
  only:
    - stage
  script:
    - |
      set -e

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      docker push "$CI_REGISTRY_IMAGE:cache"